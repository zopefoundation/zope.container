# Generated with zope.meta (https://zopemeta.readthedocs.io/) from:
# https://github.com/zopefoundation/meta/tree/master/src/zope/meta/c-code
[meta]
template = "c-code"
commit-id = "732b6ec9"

[python]
with-windows = true
with-pypy = true
with-future-python = true
with-docs = true
with-sphinx-doctests = false
with-macos = false
with-free-threaded-python = false

[tox]
testenv-setenv = [
    "ZOPE_INTERFACE_STRICT_IRO=1",
    ]

[coverage]
fail-under = 97

[check-manifest]
additional-ignores = [
    "docs/_build/html/_static/*/*",
    ]

[flake8]
additional-config = [
    "# F401 imported but unused",
    "per-file-ignores =",
    "    src/zope/container/interfaces.py: F401",
    ]

[manifest]
additional-rules = [
    "include *.yaml",
    "include *.sh",
    "include .readthedocs.yaml",
    "include compat.cfg",
    "recursive-include docs *.bat",
    "recursive-include include/persistent *.h",
    "recursive-include include/zope.proxy *.c",
    "recursive-include include/zope.proxy *.h",
    "recursive-include src *.h",
    "recursive-include src *.rst",
    "recursive-include src *.zcml",
    ]
